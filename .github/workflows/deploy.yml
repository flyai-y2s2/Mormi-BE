name: CI/CD (PR 검증, develop → ECR → EC2)

on:
  push:
    branches: [develop]
  # 머지 뒤에 처음 알면 develop 이 깨진 채로 남는다. PR 단계에서 테스트만 돌린다.
  pull_request:
    branches: [develop]
  workflow_dispatch: {}

concurrency:
  # develop 배포는 순서를 지켜야 하므로 취소하지 않고, PR 은 새 푸시가 이전 실행을 대체한다.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build & test (Testcontainers PostgreSQL)
        run: ./gradlew --no-daemon clean build

      # PR 검증은 빌드·테스트까지만 하면 되므로 배포용 산출물은 만들지 않는다.
      - name: Upload JAR artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/app.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Build image, push to ECR, deploy to EC2
    needs: build
    # PR 은 검증만 한다. 배포는 develop 에 머지된 뒤에만 일어난다.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: Show OIDC subject
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com')
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            )
            console.log("OIDC sub:", payload.sub)
            console.log("OIDC aud:", payload.aud)

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tags
        id: tags
        run: |
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          REPO="${{ env.ECR_REPOSITORY }}"
          SHA_TAG="${GITHUB_SHA}"
          BRANCH_TAG="develop"

          echo "sha_image=${REGISTRY}/${REPO}:${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "branch_image=${REGISTRY}/${REPO}:${BRANCH_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        run: |
          docker build \
            -t "${{ steps.tags.outputs.sha_image }}" \
            -t "${{ steps.tags.outputs.branch_image }}" \
            .

          docker push "${{ steps.tags.outputs.sha_image }}"
          docker push "${{ steps.tags.outputs.branch_image }}"

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy container on EC2
        env:
          IMAGE_URI: ${{ steps.tags.outputs.sha_image }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          AWS_REGION: ${{ env.AWS_REGION }}

        run: |
          ssh -i ~/.ssh/id_deploy \
              "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
              "IMAGE_URI='${IMAGE_URI}' REGISTRY='${REGISTRY}' AWS_REGION='${AWS_REGION}' bash -s" <<'REMOTE'

          set -euo pipefail

          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${REGISTRY}"

          # 새 이미지를 받을 자리를 먼저 만든다.
          #
          # 배포마다 커밋 SHA 태그가 붙은 이미지가 새로 쌓인다. 태그가 있으면 dangling 이
          # 아니라서 배포 끝의 `docker image prune -f` 로는 지워지지 않는다. 그대로 두면
          # 몇 번 배포 뒤 pull 이 "no space left on device" 로 죽는데, 그때는 배포 끝의
          # 정리에 도달하지도 못한다. 그래서 pull 앞에서도 한 번 치운다.
          #
          # 실행 중인 컨테이너가 참조하는 이미지는 docker 가 삭제를 거부하므로,
          # 지금 서비스 중인 컨테이너는 이 정리에 영향을 받지 않는다.
          docker container prune -f >/dev/null || true
          docker image prune -af --filter "until=72h" >/dev/null || true

          # 하루에 여러 번 배포한 날은 위 필터가 아무것도 지우지 못한다(전부 72시간 이내).
          # 여유가 모자라면 필터를 빼고 미사용 이미지를 전부 지운다. 지워진 이미지는
          # ECR 에 남아 있어 롤백할 때 다시 받으면 된다.
          avail_mb="$(df -Pm / | awk 'NR==2 {print $4}')"
          if [ "${avail_mb}" -lt 2048 ]; then
            echo "free space ${avail_mb}MB is low; pruning all unused images"
            docker image prune -af >/dev/null || true
            avail_mb="$(df -Pm / | awk 'NR==2 {print $4}')"
          fi
          echo "free space before pull: ${avail_mb}MB"

          docker pull "${IMAGE_URI}"

          docker rm -f mormi-backend 2>/dev/null || true

          # AI와 BE가 같은 EC2에 있다면 컨테이너 이름으로 직접 통신한다.
          # 서로 다른 EC2라면 mormi.env의 MORMI_DIALOGUE_BASE_URL을 그대로 쓴다.
          docker network create mormi-services 2>/dev/null || true
          configured_dialogue_url="$(awk -F= \
            '$1 == "MORMI_DIALOGUE_BASE_URL" {sub(/^[^=]*=/, ""); print; exit}' \
            /etc/mormi-backend/mormi.env)"
          runtime_dialogue_url="${configured_dialogue_url}"
          if docker ps --format '{{.Names}}' | grep -q '^mormi-ai$'; then
            docker network connect mormi-services mormi-ai 2>/dev/null || true
            runtime_dialogue_url="http://mormi-ai:8000"
            echo "using local mormi-ai container through mormi-services network"
          elif [[ "${configured_dialogue_url%/}" == *:800 ]]; then
            # 기존 서버 설정의 :800 오타를 안전하게 보정한다.
            runtime_dialogue_url="${configured_dialogue_url%/}0"
            echo "corrected legacy MORMI_DIALOGUE_BASE_URL port 800 to 8000"
          fi

          # 같은 이름의 환경변수를 두 번 넣으면 JVM이 원본 값을 고를 수 있다.
          # 비밀값은 유지하되 AI 주소 한 줄만 제외한 임시 env를 사용한다.
          runtime_env="$(mktemp)"
          grep -v '^MORMI_DIALOGUE_BASE_URL=' /etc/mormi-backend/mormi.env > "${runtime_env}"

          docker run -d \
            --name mormi-backend \
            --restart unless-stopped \
            --network mormi-services \
            --env-file "${runtime_env}" \
            -e MORMI_DIALOGUE_BASE_URL="${runtime_dialogue_url}" \
            -p 8080:8080 \
            --log-opt max-size=10m \
            --log-opt max-file=5 \
            "${IMAGE_URI}"
          rm -f "${runtime_env}"

          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/actuator/health 2>/dev/null \
               || curl -fsS -o /dev/null http://localhost:8080/ 2>/dev/null; then
              echo "container is responding on :8080"
              break
            fi

            if ! docker ps --format '{{.Names}}' | grep -q '^mormi-backend$'; then
              echo "container exited during startup"
              docker logs --tail=200 mormi-backend || true
              exit 1
            fi

            sleep 2
          done

          # BE 컨테이너와 같은 네트워크 위치에서 실제 AI health를 확인한다.
          dialogue_url="$(docker inspect mormi-backend \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | awk -F= '$1 == "MORMI_DIALOGUE_BASE_URL" {sub(/^[^=]*=/, ""); print; exit}')"
          if [ -z "${dialogue_url}" ]; then
            echo "MORMI_DIALOGUE_BASE_URL is not configured"
            exit 1
          fi
          if ! docker run --rm --network container:mormi-backend \
              curlimages/curl:8.10.1 \
              --connect-timeout 3 --max-time 12 -fsS \
              "${dialogue_url%/}/health"; then
            echo "Mormi-AI is unreachable from the backend container"
            exit 1
          fi

          # 공개 health만 통과하면 포트 오타는 잡아도 서비스 키 불일치는 놓친다.
          # BE에 실제 주입된 키로 인증 health까지 통과해야 배포 성공으로 본다.
          dialogue_service_key="$(docker inspect mormi-backend \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | awk -F= '$1 == "MORMI_DIALOGUE_SERVICE_KEY" {sub(/^[^=]*=/, ""); print; exit}')"
          if [ -z "${dialogue_service_key}" ]; then
            echo "MORMI_DIALOGUE_SERVICE_KEY is not configured"
            exit 1
          fi
          if ! docker run --rm --network container:mormi-backend \
              curlimages/curl:8.10.1 \
              --connect-timeout 3 --max-time 12 -fsS \
              -H "X-Mormi-Service-Key: ${dialogue_service_key}" \
              "${dialogue_url%/}/health/authenticated"; then
            echo "Mormi-AI service key does not match the backend configuration"
            exit 1
          fi

          # 새 컨테이너가 정상 기동한 뒤이므로, 직전 버전을 포함해 안 쓰는 이미지는 모두 정리한다.
          # -f 만 쓰면 태그 없는 이미지만 지워져 SHA 태그가 붙은 예전 배포본이 계속 쌓인다.
          docker image prune -af >/dev/null || true
          df -h / | tail -1
          docker ps --filter name=mormi-backend

          REMOTE
