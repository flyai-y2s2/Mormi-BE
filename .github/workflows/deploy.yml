name: CI/CD (develop → EC2)

on:
  push:
    branches: [ develop ]
  workflow_dispatch: {}

concurrency:
  group: deploy-develop
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build & test (Testcontainers PostgreSQL)
        run: ./gradlew --no-daemon clean build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/app.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ./dist

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload JAR to EC2
        run: |
          scp -i ~/.ssh/id_deploy \
              ./dist/app.jar \
              "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/app.jar"

      - name: Install JAR and restart service
        run: |
          ssh -i ~/.ssh/id_deploy \
              "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
              'set -e
               sudo install -o mormi -g mormi -m 640 /tmp/app.jar /opt/mormi-backend/app.jar
               rm -f /tmp/app.jar
               sudo systemctl restart mormi-backend
               sudo systemctl --no-pager status mormi-backend | sed -n "1,15p"'
