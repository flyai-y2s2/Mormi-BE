spring:
  application:
    name: backend

  profiles:
    default: local

  # DialogueService.respond() 는 @Transactional 안에서 AI 대화 응답(약 10초)을 기다리므로
  # 자유 발화 1건이 DB 커넥션 1개를 그 시간 동안 점유한다. 기본 풀(10)로는 동시 사용자
  # 약 20명이 천장이고(부하테스트 2026-08-27: 30명에서 대기 p50 +8.6s, 30초 타임아웃 503),
  # 30명 동시 세션을 위해 풀을 넓힌다. 세션이 끝나면 idle 커넥션은 60초 뒤 반납해
  # RDS(db.t4g) 메모리를 오래 잡지 않는다. 근본 해결은 AI 호출을 트랜잭션 밖으로 빼는 것.
  datasource:
    hikari:
      maximum-pool-size: ${MORMI_DB_POOL_MAX:30}
      minimum-idle: ${MORMI_DB_POOL_MIN_IDLE:10}
      idle-timeout: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # 계약 문서와 프런트가 snake_case 를 쓰므로 전역으로 맞춘다.
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

mormi:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  local-report-admin:
    # 서버 간 공유 키로 보호되는 교사용 리포트 조회. 키나 enabled가 없으면 닫힌다.
    enabled: ${MORMI_LOCAL_REPORT_ADMIN_ENABLED:false}
    key: ${MORMI_LOCAL_REPORT_ADMIN_KEY:}
  observation:
    # AI가 관찰 이벤트를 보낼 때 쓰는 공유 키. 비어 있으면 /internal/** 은 전부 401 이다.
    ingest-key: ${MORMI_OBSERVATION_INGEST_KEY:}
  dialogue:
    # 비어 있으면 가르치기 500원을 지급하지 않는다.
    base-url: ${MORMI_DIALOGUE_BASE_URL:}
    service-key: ${MORMI_DIALOGUE_SERVICE_KEY:}
    # 자유 발화는 분류기와 모르미 화자를 순차 호출하므로 12초보다 길 수 있다.
    read-timeout-seconds: ${MORMI_DIALOGUE_READ_TIMEOUT_SECONDS:45}
