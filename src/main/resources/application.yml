spring:
  application:
    name: backend

  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # 계약 문서와 프런트가 snake_case 를 쓰므로 전역으로 맞춘다.
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

mormi:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  dialogue:
    # 비어 있으면 가르치기 500원을 지급하지 않는다.
    base-url: ${MORMI_DIALOGUE_BASE_URL:}
    service-key: ${MORMI_DIALOGUE_SERVICE_KEY:}
