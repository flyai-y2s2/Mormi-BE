spring:
  application:
    name: backend

  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # 계약 문서와 프런트가 snake_case 를 쓰므로 전역으로 맞춘다.
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

mormi:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  local-report-admin:
    # 서버 간 공유 키로 보호되는 교사용 리포트 조회. 키나 enabled가 없으면 닫힌다.
    enabled: ${MORMI_LOCAL_REPORT_ADMIN_ENABLED:false}
    key: ${MORMI_LOCAL_REPORT_ADMIN_KEY:}
  observation:
    # AI가 관찰 이벤트를 보낼 때 쓰는 공유 키. 비어 있으면 /internal/** 은 전부 401 이다.
    ingest-key: ${MORMI_OBSERVATION_INGEST_KEY:}
  dialogue:
    # 비어 있으면 가르치기 500원을 지급하지 않는다.
    base-url: ${MORMI_DIALOGUE_BASE_URL:}
    service-key: ${MORMI_DIALOGUE_SERVICE_KEY:}
    # 자유 발화는 분류기와 모르미 화자를 순차 호출하므로 12초보다 길 수 있다.
    read-timeout-seconds: ${MORMI_DIALOGUE_READ_TIMEOUT_SECONDS:45}
